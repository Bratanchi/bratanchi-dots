general {



    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    #path = $HOME/Pictures/Wallpapers/galaxy.png
    #color = $background
    blur_passes = 2
    blur_size = 2
    contrast = 1
    brightness = 0.8
    vibrancy = 0.16
    vibrancy_darkness = 0.1
}

image {
    monitor =
    path = $HOME/Pictures/Wallpapers/Bratanchi.png
    size = 100
    valign = center
    halign = center
    border_size = 2
    rounding = 0
    position = 0, -30
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d, %B")"
    color = rgba(220, 215, 186, 0.9)
    font_size = 22
    font_family = JetBrains Mono
    shadow_passes = 2
    shadow_size = 1
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(220, 215, 186, 0.9)
    font_size = 150
    font_family = C059
    font_size = bold
    shadow_passes = 2
    shadow_size = 1
    position = 0, 180
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 150, 60
    outline_thickness = 1
    dots_size = 0.25
    dots_center = true
    dots_spacing = 0.25
    dots_color = rgba(e6, c3, 8c, 1.0)
    outer_color = rgba(c5, c1, b4, 0.8)      # Сдержанный светлый (Dragon White) для внешней рамки
    inner_color = rgba(18, 18, 22, 0.85)     # Глубокий темный (Dragon Black) для фона поля
    font_color = rgba(c8, c0, b7, 1.0)
    fade_on_empty = false
    placeholder_text = something
    fail_text = 滚蛋
    position = 0, -150
    valign = center
    halign = center
}
