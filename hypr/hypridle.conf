general {
    lock_cmd = pidof hyprlock || hyprlock       # команда для блокировки, чтобы избежать дублирования
    before_sleep_cmd = loginctl lock-session    # блокировка перед переходом системы в режим сна
    after_sleep_cmd = hyprctl dispatch dpms on  # включаем монитор обратно после пробуждения
}

# 1. Блокировка экрана через 300 секунд (5 минут)
listener {
    timeout = 300
    on-timeout = loginctl lock-session          # либо можно сразу вызвать 'hyprlock'
}

# 2. Отключение монитора через 330 секунд (5.5 минут)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off      # выключаем монитор
    on-resume = hyprctl dispatch dpms on        # включаем монитор при активности (шевеление мышью/нажатие клавиш)
}
