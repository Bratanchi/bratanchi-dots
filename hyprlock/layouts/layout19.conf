background {
    monitor = 
    path = screenshot
    #path = $HOME/Pictures/Wallpapers/galaxy.png
    #color = $background
    blur_passes = 2
    blur_size = 2
    contrast = 1
    brightness = 0.8
    vibrancy = 0.16
    vibrancy_darkness = 0.1
}

label {
    monitor = 
    text = cmd[update:1000] echo "$(date +"%H, %M, %S")"
    color = rgba(220, 215, 186, 0.9)
    font_size = 22
    font_family = JetBrains Mono
    shadow_passes = 2
    shadow_size = 1
    position = 0, 300
    halign = center
    valign = center
}

image {
    monitor = 
    path = $HOME/Pictures/Wallpapers/Bratanchi.png
    size = 100
    valign = center
    halign = center
    border_size = 2
    rounding = 0
    position = 0, -30
}

input-field {
    monitor = 
    size = 150, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    placeholder_text = 
    fail_text = DURWA WRONG
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(220, 215, 186, 0.8)
    font_family = JetBrains Mono
    check_color = rgb(204, 136, 34)
    position = 0, -200
    halign = center
    valign = center
}

